name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24", "1.25", "1.26"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: go mod verify
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -v -coverprofile=coverage.out -covermode=atomic ./...
      - name: Build examples
        run: cd examples && go build ./...
      # cmd/agentrun-mcp es un modulo aparte que SI se publica via `go install @latest`.
      # Se construye dos veces a proposito:
      #   1. standalone -> prueba que su go.mod es instalable (sin `replace` al padre).
      #      Un `replace` aqui rompe `go install @latest` y CI no lo veia.
      #   2. con go.work -> prueba que sigue compilando contra el codigo de ESTE commit,
      #      no contra la version publicada que declara su require.
      - name: Build MCP server (standalone, como lo ve `go install @latest`)
        run: cd cmd/agentrun-mcp && go build ./...
      - name: Build MCP server (contra el working tree)
        run: |
          go work init . ./cmd/agentrun-mcp
          go build ./cmd/agentrun-mcp/...
          rm go.work
      - name: Upload coverage
        if: matrix.go == '1.26' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

